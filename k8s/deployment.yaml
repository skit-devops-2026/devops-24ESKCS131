apiVersion: apps/v1
kind: Deployment
metadata:
  name: dinemind-deployment
  labels:
    app: dinemind
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dinemind
  template:
    metadata:
      labels:
        app: dinemind
        tier: frontend
    spec:
      containers:
      - name: dinemind-web
        image: ghcr.io/skit-devops-2026/devops-24eskcs131:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
