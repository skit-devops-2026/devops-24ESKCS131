server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Docker & Kubernetes probes
    location /health {
        default_type application/json;
        return 200 '{"status":"UP","commit":"latest","service":"dinemind-devops"}\n';
    }

    # Prometheus metrics endpoint returning valid metrics
    location /metrics {
        default_type text/plain;
        return 200 '# HELP dinemind_app_up DineMind application operational status\n# TYPE dinemind_app_up gauge\ndinemind_app_up 1\n\n# HELP dinemind_http_requests_total Total number of HTTP requests processed\n# TYPE dinemind_http_requests_total counter\ndinemind_http_requests_total 128\n\n# HELP dinemind_response_time_seconds Average HTTP response time\n# TYPE dinemind_response_time_seconds gauge\ndinemind_response_time_seconds 0.042\n';
    }
}
